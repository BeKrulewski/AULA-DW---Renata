<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
</head>
<body>
    <style>
        table {
            border-collapse: collapse;
        }
        th, td {
            border: 1px dashed #000000;
            border-collapse: collapse;
            text-align: center;
            padding: 10px;
        }
        .cabecalho {
            background-color: #e4a5a5;
        }
    </style>
    <table>
        <caption>Formação Acadêmica e profissional</caption>
        <tr class="cabecalho">
            <th rowspan="2">Estudante</th>
            <th colspan="2">Formação</th>
            <th rowspan="2">Ano de Conclusão</th>
         </tr>
        <tr class="cabecalho">
            <th>Graduação</th>
            <th>Pós-Graduação</th>
         </tr>
        <tr>
            <th>José</th>
            <td>Ciência da Computação</td>
            <td>Inteligência Artificial</td>
            <td>2023</td>
        </tr>
         <tr>
            <th>Maria</th>
            <td>Engenharia de Software</td>
            <td>Gestão de Projetos</td>
            <td>2022</td>
        </tr>

       </table>
</body>
</html>
